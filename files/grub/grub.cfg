search --set=root --file /ubuntu

insmod all_video

set default="0"
set timeout=10

### ----------------------------------------
### 1. Autoinstall Ubuntu Server (T2)
### ----------------------------------------
menuentry "Install Ubuntu Server (T2 Autoinstall)" {
    linux /casper/vmlinuz boot=casper quiet autoinstall \
      ds=nocloud-net;s=/cdrom/autoinstall/ \
      pcie_ports=native intel_iommu=on iommu=pt ---
    initrd /casper/initrd
}

### ----------------------------------------
### 2. Live environment (optional)
### ----------------------------------------
menuentry "Try Ubuntu (Live Environment)" {
    linux /casper/vmlinuz boot=casper ro quiet splash \
      pcie_ports=native intel_iommu=on iommu=pt ---
    initrd /casper/initrd
}

### ----------------------------------------
### 3. Safe Graphics (Live Environment)
### ----------------------------------------
menuentry "Ubuntu (Safe Graphics)" {
    linux /casper/vmlinuz boot=casper ro quiet splash nomodeset \
      pcie_ports=native intel_iommu=on iommu=pt ---
    initrd /casper/initrd
}

### ----------------------------------------
### 4. NVMe Blacklisted (Live Environment)
### ----------------------------------------
menuentry "Ubuntu (NVMe Blacklisted)" {
    linux /casper/vmlinuz boot=casper ro quiet splash \
      pcie_ports=native intel_iommu=on iommu=pt \
      modprobe.blacklist=nvme ---
    initrd /casper/initrd
}

### ----------------------------------------
### 5. Disc Check
### ----------------------------------------
menuentry "Check disc for defects" {
    linux /casper/vmlinuz boot=casper integrity-check enforcing=0 \
      efi=noruntime pcie_ports=native ---
    initrd /casper/initrd
}